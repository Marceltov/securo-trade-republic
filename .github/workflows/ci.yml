name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      # Markdown, YAML and JSON (engineering conventions: code/formatting.md).
      - run: npx --yes prettier@3 --check .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      # Includes the check that requirements.txt (what Securo's runner installs) is the export of uv.lock.
      - run: uv run pytest -q
