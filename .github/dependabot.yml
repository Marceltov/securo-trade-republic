version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    open-pull-requests-limit: 5
    # Dev tools only. The runtime dependencies are what Securo installs: they change by hand, with
    # requirements.txt re-exported and the plugin reviewed.
    # The daily audit workflow reports advisories against them.
    allow:
      - dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: Dependencies
    labels: [dependencies]
    open-pull-requests-limit: 5
