name: audit
# Daily, because an advisory arrives without a commit: the runtime dependencies Securo installs.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uvx pip-audit --strict --require-hashes --disable-pip -r requirements.txt
